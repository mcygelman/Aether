<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operator account · Aether Mission Control</title><link rel="stylesheet" href="/workspace-assets/ui.css"><style>main{max-width:540px;margin:36px auto}.ui-card{padding:26px}form{display:grid;gap:12px}form label{margin-top:8px}#message{white-space:pre-wrap}input{width:100%}.tabs{margin:18px 0}</style></head><body><script src="/settings/models-context/atelier-nav.js"></script><main><section class="ui-card"><h1 id="title">Operator account</h1><p id="intro" class="muted"></p><div class="tabs" id="choices"><button id="signin" type="button">Sign in</button><button id="signup" type="button">Create account</button></div><form id="account-form"><div id="name-box"><label for="name">Display name</label><input id="name" autocomplete="name" maxlength="120"></div><div id="username-box"><label for="username">Username</label><input id="username" autocomplete="username" minlength="3" maxlength="64"></div><div id="current-box" hidden><label for="current">Current account password</label><input id="current" type="password" autocomplete="current-password"></div><label for="password" id="password-label">Account password</label><input id="password" type="password" autocomplete="current-password" maxlength="256" required><div id="confirm-box"><label for="confirmation">Confirm account password</label><input id="confirmation" type="password" autocomplete="new-password" maxlength="256"></div><p class="small" id="password-note">Use at least 12 characters. This is separate from your API vault password.</p><p id="message" role="alert"></p><div class="actions"><button class="primary" id="submit" type="submit">Sign in</button><a id="back" class="button" href="/" hidden>Back to Chat</a></div></form></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let mode='login',session=null;
function returnTarget(){try{const target=new URL(new URLSearchParams(location.search).get('next')||'/',location.origin);return target.origin===location.origin&&target.pathname!=='/login'?target.href:'/workspace?view=settings';}catch(_){return '/workspace?view=settings';}}
function show(next){mode=next;const create=mode==='register',change=mode==='password';$('name-box').hidden=!create;$('name').required=create;$('username-box').hidden=change;$('username').required=!change;$('current-box').hidden=!change;$('current').required=change;$('confirm-box').hidden=mode==='login';$('confirmation').required=mode!=='login';$('password').minLength=mode==='login'?1:12;$('password').autocomplete=create||change?'new-password':'current-password';$('password-label').textContent=change?'New account password':'Account password';document.querySelector('label[for="confirmation"]').textContent=change?'Confirm new account password':'Confirm account password';$('password-note').hidden=mode==='login';$('choices').hidden=!!session?.user||session?.first_account;$('back').hidden=!session?.user;$('back').href=returnTarget();$('back').textContent='Return to workspace';$('title').textContent=change?'Change password':create?(session?.first_account?'Create the first Admin account':'Create a User account'):'Sign in';$('intro').textContent=change?'Signed in as '+session.user.name+'. Change your sign-in password. Your API vault and saved keys stay unchanged.':create?(session?.first_account?'The first account is an Admin with full access. Other Admins can be added later.':'New accounts are Users: full Chat and view-only access elsewhere. An Admin can add management permissions.'):'Sign in to use Chat and your permitted workspace controls.';$('submit').textContent=change?'Change password':create?'Create account':'Sign in';$('message').textContent='';}
async function api(route,body){const r=await fetch('/api/access/'+route,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{cache:'no-store'});const v=await r.json();if(!r.ok)throw Error(v.error);return v;}
$('signin').onclick=()=>show('login');$('signup').onclick=()=>show('register');$('account-form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('message').textContent='';try{const value=await api(mode,{name:$('name').value,username:$('username').value,password:$('password').value,confirmation:$('confirmation').value,current_password:$('current').value});for(const id of ['password','confirmation','current'])$(id).value='';if(mode==='password'){session.user=value.user;show('password');$('message').textContent='Your account password has been changed. Other sessions for this account have been signed out.';}else location.assign(mode==='register'&&session?.first_account?'/workspace?view=settings&setup=1':returnTarget());}catch(error){$('message').textContent=error.message;}finally{$('submit').disabled=false;}};
api('session').then(v=>{session=v;show(v.user?'password':v.first_account?'register':'login');}).catch(e=>$('message').textContent=e.message);
})();</script></body></html>
