<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat · Aether Mission Control</title>
<link rel="stylesheet" href="/workspace-assets/chat.css"></head><body>
<script src="/settings/models-context/atelier-nav.js"></script>
<main>
<div class="chat-context-controls"><label for="model" class="sr-only">Choose Model</label><select id="model" aria-label="Choose Model"><option value="">Choose Model</option></select>
</div>
<div class="chat-hints"><p id="chat-folder-status">Personal scratchpad available when you start a chat.</p><span id="tags">Private personal cartridge · model-only Chat</span></div>
<div class="workspace">
<aside id="history-panel" hidden><h2>Chat history</h2><input id="search" type="search" placeholder="Find a chat, tag or words said" aria-label="Find a chat, tag or words said"><label class="muted"><input id="show-deleted" type="checkbox"> Include deleted chats</label><ul id="history-list"></ul></aside>
<section class="conversation" aria-label="Conversation"><div class="chat-heading"><h1 id="title" hidden></h1><span class="muted">Conversation with a model</span></div><div id="thread" role="log" aria-live="polite"></div><button id="end" class="jump-latest" type="button" hidden>Jump to latest</button><div id="status" role="status"></div></section>
</div>
<div class="composer"><label for="text" class="sr-only">Message</label><textarea id="text" rows="3" placeholder="Enter chat text here"></textarea><button id="stop" hidden>Stop response</button><button id="send">Send</button></div>
<div class="toolbar chat-actions" role="toolbar" aria-label="Chat actions">
<button id="new">New</button><button id="delete">Delete</button><button id="history" aria-expanded="false" aria-controls="history-panel">History</button>
<details class="more"><summary>More</summary><div class="menu" id="chat-more">
<button id="chat-folder">Working folder</button>
<details class="sub"><summary>Export</summary><div class="sub-items"><button data-export="text">Text</button><button data-export="json">JSON</button><button data-export="xml">XML</button></div></details>
<details class="sub"><summary>Transform</summary><div class="sub-items"><p>Selected messages, or the whole chat</p><button data-transform="summary">Summarize</button><button data-transform="bullets">Bullet points</button><button data-transform="tasks">Task list</button><button data-transform="aether">To Aether</button><button data-transform="teachframe">Teach Frame</button></div></details>
<hr><button id="tag">Add tag</button>
<hr><button id="artifacts">Artifacts</button>
<hr><div id="chat-more-sources"></div>
<hr><div id="chat-more-knowledge"></div>
<hr><button id="top">Jump to top</button>
</div></details>
<span class="spacer"></span><span class="hint">Enter sends · Shift+Enter adds a line</span></div>
</main>
<dialog id="artifact-dialog"><h2 id="artifact-title">Artifact</h2><p class="muted" id="artifact-source"></p><p id="artifact-error" role="alert"></p><select id="artifact-picker" aria-label="Saved artifact"></select><label for="artifact-text" class="sr-only">Artifact text</label><textarea id="artifact-text"></textarea><div class="dialog-actions"><button id="save-artifact">Save edits</button><button id="artifact-text-export">Export Text</button><button id="artifact-json-export">Export JSON</button><button id="artifact-xml-export">Export XML</button><button id="close-artifact">Close</button></div></dialog>
<dialog id="tag-dialog"><form method="dialog" id="tag-form"><h2>Add tag</h2><label for="tag-value">Tag</label><input id="tag-value" maxlength="60" required><div class="dialog-actions"><button type="submit">Add tag</button><button type="button" id="cancel-tag">Cancel</button></div></form></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),API='/api/model-chat';
let found={q:'',hits:{}},searchTimer=null,searchSeq=0;
// Words said in a chat are searched on the server, a moment after typing stops; titles and tags match at once.
async function searchSaid(){const q=$('search').value.toLowerCase().trim(),seq=++searchSeq;let hits={};if(q.length>=2){try{const v=await api('?search='+encodeURIComponent(q));hits=Object.fromEntries(v.matches.map(m=>[m.id,m]));}catch(e){}}if(seq!==searchSeq)return;found={q,hits};renderHistory();}
let current=null,catalog=[],models=[],selected=new Set(),busy=false,polling=false,version=0,displaySignature='',artifactId=null;
function node(tag,text,cls){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e;}
function showStatus(text){$('status').replaceChildren(document.createTextNode(text||''));if(/unlock.*API keys/i.test(text||'')){const link=node('a','Open API Keys');link.href='/settings/api-keys/';$('status').append(document.createTextNode(' '),link);}}
async function api(action='',body){const options={cache:'no-store'};if(body!==undefined){options.method='POST';options.headers={'Content-Type':'application/json'};options.body=JSON.stringify(body);}const r=await fetch(API+action,options);const v=await r.json();if(!r.ok)throw Error(v.error||'The request could not be completed.');return v;}
function controls(){const running=current?.job.status==='running';$('send').disabled=busy||running||!!current?.deleted||!!current?.agent_closed;$('stop').hidden=!running;$('delete').disabled=busy||!current||current.deleted;$('tag').disabled=!current||busy;$('artifacts').disabled=!current?.artifacts.length;for(const b of document.querySelectorAll('[data-transform]'))b.disabled=busy||running||!current?.messages.length||current.deleted;}
function renderHistory(){const list=$('history-list'),q=$('search').value.toLowerCase(),said=found.q===q.trim()?found.hits:{};list.replaceChildren();for(const c of catalog){if(c.deleted&&!$('show-deleted').checked)continue;const hit=said[c.id];if(!(c.title+' '+c.tags.join(' ')).toLowerCase().includes(q)&&!hit)continue;const li=node('li'),b=node('button',c.title);b.type='button';if(c.id===current?.id)b.setAttribute('aria-current','true');b.append(node('small',(c.deleted?'Deleted · ':'')+c.updated_at.slice(0,10)+(c.tags.length?' · '+c.tags.join(', '):'')));if(hit)b.append(node('small',(hit.role==='user'?'You: ':'Model: ')+hit.snippet,'snippet'));b.onclick=()=>openChat(c.id);li.append(b);list.append(li);}if(!list.childElementCount)list.append(node('li','No chats here yet.','muted'));}
async function refresh(){const v=await api();catalog=v.chats;models=v.models;const keep=$('model').value;$('model').replaceChildren();if(!models.length){const o=node('option','Choose Model — request a connection or key assignment');o.value='';$('model').append(o);}else for(const m of models){const o=node('option',m.model+' · '+m.id);o.value=m.id;$('model').append(o);}if(models.some(m=>m.id===keep))$('model').value=keep;renderHistory();}
function render(){const t=$('thread'),stick=t.scrollTop+t.clientHeight>=t.scrollHeight-60;const signature=JSON.stringify([current?.id,current?.messages.map(m=>m.id)]);$('title').textContent=current?.title||'';$('title').hidden=!current?.title||current.title==='New chat';$('tags').textContent=current?.tags.length?'Tags: '+current.tags.join(' · '):'Private personal cartridge · model-only Chat';
 if(signature!==displaySignature){displaySignature=signature;t.replaceChildren();if(!current?.messages.length){const e=node('div',null,'empty');e.append(node('h2','What would you like to explore?'),node('p','Choose a model and start a conversation. Turn useful ideas into an artifact whenever you are ready.'));if(!models.length){const a=node('a','Model connections and key access');a.href='/settings/models-context/';e.append(a);}t.append(e);}else for(const m of current.messages){const row=node('article',null,'message '+m.role),pick=node('input');pick.type='checkbox';pick.checked=selected.has(m.id);pick.setAttribute('aria-label','Select '+m.role+' message for transformation');pick.onchange=()=>pick.checked?selected.add(m.id):selected.delete(m.id);const body=node('div');body.append(node('div',m.role==='user'?'You':m.agent?m.agent+(m.kind==='closing'?' · closing words, filed in its memory':''):models.find(x=>x.id===m.model)?.model||m.model||'Model','who'),node('div',m.content,'body'));row.append(pick,body);t.append(row);}if(stick)t.scrollTop=t.scrollHeight;}
 const job=current?.job||{};if(job.status==='running')showStatus(job.kind==='closing'?(current.agent?.name||'The agent')+' is writing its closing words…':job.kind==='reply'?(current.agent?current.agent.name+' is responding…':'Model is responding…'):'Preparing the artifact…');else if(job.error)showStatus(job.error);else if(job.context_messages_omitted)showStatus(job.context_messages_omitted+' earlier messages are saved but were outside this response’s model context.');else showStatus('');
 if(current?.deleted){showStatus('This chat is deleted. ');const restore=node('button','Restore');restore.onclick=()=>mutate('restore');$('status').append(restore);}controls();renderHistory();window.chatFilesChanged?.(current);window.chatAgentChanged?.(current);latest();}
async function openChat(id){if(busy)return;const token=++version;try{const value=await api('?id='+encodeURIComponent(id));if(token!==version)return;current=value;selected.clear();historyState();render();$('thread').scrollTop=$('thread').scrollHeight;}catch(e){showStatus(e.message);}}
function historyState(){window.history.replaceState(null,'',current?'?chat='+encodeURIComponent(current.id):location.pathname);}
async function ensureChat(){if(!current){current=await api('/new',{});historyState();}return current.id;}
async function send(){const text=$('text').value;if(!text.trim()||busy||current?.job.status==='running')return;if(!$('model').value){showStatus('Choose an available model connection. If none appear, ask for a model connection and API key assignment.');return;}busy=true;controls();try{const id=await ensureChat();current=await api('/send',{id,text,model:$('model').value});$('text').value='';resize();render();await refresh();}catch(e){showStatus(e.message);}finally{busy=false;controls();}}
async function transform(kind){if(busy||!current)return;closeMenus();busy=true;controls();try{const count=current.artifacts.length;current=await api('/transform',{id:current.id,model:$('model').value,transform:kind,...(selected.size?{messages:[...selected]}:{})});render();if(current.artifacts.length>count)showArtifact();}catch(e){showStatus(e.message);}finally{busy=false;controls();}}
async function mutate(action,extra={}){if(!current)return;const id=current.id,token=version;try{const value=await api('/'+action,{id,...extra});if(current?.id===id&&version===token){current=value;render();}await refresh();return true;}catch(e){showStatus(e.message);if(action==='save-artifact')$('artifact-error').textContent=e.message;return false;}}
function download(format,value,name){const esc=s=>String(s).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));let body,type,extension;
 if(format==='json'){body=JSON.stringify(value,null,2);type='application/json';extension='json';}
 else if(format==='xml'){const xml=(key,v)=>Array.isArray(v)?'<'+key+'>'+v.map(x=>xml('item',x)).join('')+'</'+key+'>':v&&typeof v==='object'?'<'+key+'>'+Object.entries(v).map(([k,x])=>xml(k,x)).join('')+'</'+key+'>':'<'+key+'>'+esc(v??'')+'</'+key+'>';body='<?xml version="1.0" encoding="UTF-8"?>\n'+xml('artifact',value);type='application/xml';extension='xml';}
 else{body=value.content??(value.title+'\n\n'+(value.messages||[]).map(m=>(m.role==='user'?'You':m.model||'Model')+':\n'+m.content).join('\n\n'));type='text/plain';extension='txt';}
 const url=URL.createObjectURL(new Blob([body],{type:type+';charset=utf-8'})),a=node('a');a.href=url;a.download=(name||'chat').replace(/[^a-z0-9_-]+/gi,'-').slice(0,70)+'.'+extension;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);closeMenus();}
function showArtifact(id){if(!current?.artifacts.length)return;$('artifact-error').textContent='';artifactId=id||current.artifacts.at(-1).id;const a=current.artifacts.find(x=>x.id===artifactId);$('artifact-picker').replaceChildren();for(const item of current.artifacts){const o=node('option',item.title+' · '+item.at.replace('T',' ').slice(0,16));o.value=item.id;$('artifact-picker').append(o);}$('artifact-picker').value=a.id;$('artifact-title').textContent=a.title+' · draft';$('artifact-source').textContent='From '+a.source_messages.length+' messages · '+a.model+' · edit or export when ready';$('artifact-text').value=a.content;if(!$('artifact-dialog').open)$('artifact-dialog').showModal();artifactSharing();}
async function artifactSharing(){
 const id=artifactId,chat=current?.id;let button=$('artifact-copy'),hint=$('artifact-sharing');
 if(!button){button=node('button','Save to Creations…');button.id='artifact-copy';button.type='button';$('artifact-dialog').querySelector('.dialog-actions').prepend(button);hint=node('p','','muted');hint.id='artifact-sharing';$('artifact-dialog').append(hint);}
 button.hidden=true;hint.textContent='Checking sharing permissions…';
 try{const info=await (window.aetherAccess||fetch('/api/access/session',{cache:'no-store'}).then(r=>r.json()));if(current?.id!==chat||artifactId!==id)return;
  const a=current.artifacts.find(x=>x.id===id),allowed=info?.user&&(info.user.role==='admin'||a?.kind==='teachframe'&&info.user.permissions.includes('manage_teach'));
  button.hidden=!allowed;hint.textContent=allowed?'Open a workspace copy for review before saving it to the shared showcase. Save any Chat edits first. Your original artifact stays in this Chat.':'Admins can add Creations. Operators with Manage Teach can also save Teach Frames to the shared showcase.';
  button.onclick=()=>{if($('artifact-text').value!==a.content){$('artifact-error').textContent='Save your edits first, then reopen the artifact to make a workspace copy.';return;}location.assign('/workspace?view=creations&chat='+encodeURIComponent(chat)+'&artifact='+encodeURIComponent(id)+'&copy=1');};
 }catch(_){hint.textContent='Sharing permissions are unavailable. Reopen this artifact to try again.';}
}
function closeMenus(){document.querySelectorAll('.toolbar details[open]').forEach(d=>d.open=false);}
function resize(){$('text').style.height='auto';$('text').style.height=Math.min($('text').scrollHeight,240)+'px';}
$('new').onclick=()=>{if(busy)return;++version;current=null;selected.clear();historyState();displaySignature='';render();$('text').value='';resize();$('text').focus();};
$('delete').onclick=async()=>{if(!current)return;await mutate('delete');};
$('history').onclick=()=>{$('history-panel').hidden=!$('history-panel').hidden;$('history').setAttribute('aria-expanded',String(!$('history-panel').hidden));};$('search').oninput=()=>{renderHistory();clearTimeout(searchTimer);searchTimer=setTimeout(searchSaid,250);};$('show-deleted').onchange=renderHistory;
$('send').onclick=send;$('stop').onclick=()=>mutate('stop');$('text').oninput=resize;$('text').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();}};
$('top').onclick=()=>$('thread').scrollTo({top:0,behavior:'smooth'});$('end').onclick=()=>$('thread').scrollTo({top:$('thread').scrollHeight,behavior:'smooth'});
function latest(){const t=$('thread');$('end').hidden=t.scrollTop+t.clientHeight>=t.scrollHeight-60;}$('thread').addEventListener('scroll',latest);
$('chat-more').addEventListener('click',e=>{if(e.target.closest('button,a'))closeMenus();});
for(const b of document.querySelectorAll('[data-transform]'))b.onclick=()=>transform(b.dataset.transform);
for(const b of document.querySelectorAll('[data-export]'))b.onclick=()=>{if(current)download(b.dataset.export,{id:current.id,title:current.title,tags:current.tags,messages:current.messages},current.title);else showStatus('Start a chat to export its conversation.');};
$('tag').onclick=()=>{$('tag-value').value='';$('tag-dialog').showModal();};$('cancel-tag').onclick=()=>$('tag-dialog').close();$('tag-form').onsubmit=e=>{e.preventDefault();const tag=$('tag-value').value;$('tag-dialog').close();mutate('tag',{tag});};
$('artifacts').onclick=()=>showArtifact();$('close-artifact').onclick=()=>$('artifact-dialog').close();$('artifact-picker').onchange=()=>showArtifact($('artifact-picker').value);
$('save-artifact').onclick=async()=>{$('save-artifact').disabled=true;$('artifact-error').textContent='';try{if(await mutate('save-artifact',{artifact:artifactId,text:$('artifact-text').value}))$('artifact-dialog').close();}finally{$('save-artifact').disabled=false;}};
for(const format of ['text','json','xml'])$('artifact-'+format+'-export').onclick=()=>{const a=current.artifacts.find(x=>x.id===artifactId);download(format,{...a,content:$('artifact-text').value,chat_id:current.id},a.title);};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenus();});document.addEventListener('click',e=>{if(!e.target.closest('.toolbar details'))closeMenus();});
setInterval(async()=>{if(polling||busy||!current||current.job.status!=='running')return;polling=true;const id=current.id,token=version;try{const previous=current.artifacts.length;const value=await api('?id='+id);if(current?.id===id&&version===token){current=value;render();if(current.artifacts.length>previous)showArtifact();}}catch(e){showStatus(e.message);}finally{polling=false;}},1000);
(async()=>{try{await refresh();const id=new URLSearchParams(location.search).get('chat');if(id&&/^[0-9a-f]{32}$/.test(id)){const artifact=new URLSearchParams(location.search).get('artifact');await openChat(id);if(current?.artifacts.some(a=>a.id===artifact))showArtifact(artifact);}else render();}catch(e){render();showStatus(e.message);}$('text').focus();})();
window.aetherChat={current:()=>current,selected:()=>[...selected],ensure:ensureChat,mutate,status:showStatus};
</script><script type="module" src="/workspace-assets/chat-personal.js"></script><script src="/workspace-assets/chat_files.js"></script><script type="module" src="/workspace-assets/chat-sources.js"></script><script type="module" src="/workspace-assets/chat-agents.js"></script></body></html>
